name: "Build"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - 'main'
    paths:
      - "build.sh"
      - "build-pacman.sh"
      - ".github/workflows/*.yml"
      - "wslconf/*"

permissions:
  contents: write  

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    outputs:
      RELEASE: ${{ steps.start_build.outputs.RELEASE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: amd64
          path: termux-wsl-amd64.wsl
          archive: false

  build-amd64-pacman:
    runs-on: ubuntu-latest
    outputs:
      RELEASE: ${{ steps.start_build.outputs.RELEASE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build-pacman.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: amd64-pacman
          path: termux-pacman-wsl-amd64.wsl
          archive: false

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arm64
          path: termux-wsl-arm64.wsl
          archive: false

  build-arm64-pacman:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build-pacman.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arm64-pacman
          path: termux-pacman-wsl-arm64.wsl
          archive: false


  release:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-amd64-pacman, build-arm64, build-arm64-pacman]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
         merge-multiple: true

      - name: Release stable
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-amd64.outputs.RELEASE }}
          name: ${{ needs.build-amd64.outputs.RELEASE }}
          files: |
            termux-wsl-amd64.wsl
            termux-pacman-wsl-amd64.wsl
            termux-wsl-arm64.wsl
            termux-pacman-wsl-arm64.wsl
          preserve_order: true
          make_latest: true
  keepalive:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Keepalive - Update Dummy Timestamp
      run: |
        date "+%d%m%y" > keepalive
        
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        
        git add keepalive
        git commit -m "chore: automated keepalive [$(date '+%Y-%m-%d')]" || true
        git push
        
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}